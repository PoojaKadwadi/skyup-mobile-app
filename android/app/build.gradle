apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

project.ext {
    hermesEnabled = true
}
apply plugin: "com.google.gms.google-services"

def enableProguardInReleaseBuilds = true

android {

configurations.all {
        resolutionStrategy {
            force "androidx.core:core:1.13.1"
            force "androidx.core:core-ktx:1.13.1"
        }
    }
    buildToolsVersion "34.0.0"
    compileSdk 35
    namespace "com.skyupcrm"

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    defaultConfig {
        applicationId "com.skyupcrm"
        minSdkVersion 24
        targetSdkVersion 35
        versionCode 2
        versionName "1.0.1"
    }

    splits {
        abi {
            enable true
            reset()
            include "armeabi-v7a", "arm64-v8a"
            universalApk true
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (project.hasProperty('MYAPP_RELEASE_STORE_FILE')) {
                storeFile file(MYAPP_RELEASE_STORE_FILE)
                storePassword MYAPP_RELEASE_STORE_PASSWORD
                keyAlias MYAPP_RELEASE_KEY_ALIAS
                keyPassword MYAPP_RELEASE_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.debug }
        release {
            if (project.hasProperty('MYAPP_RELEASE_STORE_FILE')) {
                signingConfig signingConfigs.release
            } else {
                gradle.taskGraph.whenReady { graph ->
                    def assemblingRelease = graph.allTasks.any {
                        def n = it.name.toLowerCase()
                        n.contains('assemblerelease') || n.contains('bundlerelease') || n.contains('packagerelease')
                    }
                    if (assemblingRelease) {
                        throw new GradleException(
                            "Release keystore not configured. Set MYAPP_RELEASE_STORE_FILE, " +
                            "MYAPP_RELEASE_STORE_PASSWORD, MYAPP_RELEASE_KEY_ALIAS and " +
                            "MYAPP_RELEASE_KEY_PASSWORD (e.g. in ~/.gradle/gradle.properties) " +
                            "before running assembleRelease / bundleRelease.")
                    }
                }
            }
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.each { output ->
            def abiCodes = ["armeabi-v7a": 1, "arm64-v8a": 2]
            def abi = output.getFilter(com.android.build.OutputFile.ABI)
            if (abi != null) {
                output.versionCodeOverride = abiCodes.get(abi) * 1000 + variant.versionCode
            }
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:hermes-android")

    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")

    implementation(platform("com.google.firebase:firebase-bom:33.1.0"))
    implementation("com.google.firebase:firebase-messaging")
    implementation("com.google.firebase:firebase-analytics")
}

apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle")
applyNativeModulesAppBuildGradle(project)

android.sourceSets.main.java.srcDirs += [
    "build/generated/rncli/src/main/java"
]

apply from: file("../../node_modules/react-native-vector-icons/fonts.gradle")
