apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

project.ext {
    hermesEnabled = true
}
apply plugin: "com.google.gms.google-services"

def enableProguardInReleaseBuilds = true

android {

configurations.all {
        resolutionStrategy {
            force "androidx.core:core:1.13.1"
            force "androidx.core:core-ktx:1.13.1"
        }
    }
    buildToolsVersion "34.0.0"
    compileSdk 35
    namespace "com.skyupcrm"
    defaultConfig {
        applicationId "com.skyupcrm"
        minSdkVersion 24
        targetSdkVersion 35
        // B-2: bump versionCode on EVERY release (ideally from CI). Play Store
        // rejects an upload whose versionCode isn't strictly higher than the
        // installed build, so a stuck versionCode blocks user updates.
        versionCode 2
        versionName "1.0.1"
    }

    splits {
        abi {
            enable true
            reset()
            include "armeabi-v7a", "arm64-v8a"
            // FIX: was false — this app's APK is also distributed for manual
            // sideload via the backend's /download and /install routes (not
            // just Play Store, which handles per-ABI delivery automatically).
            // With only split APKs and no universal one, whoever runs the
            // release build has to guess which employee's phone is 32-bit vs
            // 64-bit before copying the right file to the backend. Enabling
            // the universal APK produces a third file
            // (app-universal-release.apk) that installs on either
            // architecture, so /download always has one file that works for
            // everyone.
            universalApk true
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (project.hasProperty('MYAPP_RELEASE_STORE_FILE')) {
                storeFile file(MYAPP_RELEASE_STORE_FILE)
                storePassword MYAPP_RELEASE_STORE_PASSWORD
                keyAlias MYAPP_RELEASE_KEY_ALIAS
                keyPassword MYAPP_RELEASE_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.debug }
        release {
            // S-3: NEVER silently fall back to the public debug key for a release
            // build. A debug-signed release APK cannot update over a real release
            // install and is trivially re-signable. If the release keystore is
            // configured, use it; otherwise FAIL the build — but only when a
            // release APK/bundle is actually being assembled, so debug builds and
            // IDE sync still work without the release keystore present.
            if (project.hasProperty('MYAPP_RELEASE_STORE_FILE')) {
                signingConfig signingConfigs.release
            } else {
                gradle.taskGraph.whenReady { graph ->
                    def assemblingRelease = graph.allTasks.any {
                        def n = it.name.toLowerCase()
                        n.contains('assemblerelease') || n.contains('bundlerelease') || n.contains('packagerelease')
                    }
                    if (assemblingRelease) {
                        throw new GradleException(
                            "Release keystore not configured. Set MYAPP_RELEASE_STORE_FILE, " +
                            "MYAPP_RELEASE_STORE_PASSWORD, MYAPP_RELEASE_KEY_ALIAS and " +
                            "MYAPP_RELEASE_KEY_PASSWORD (e.g. in ~/.gradle/gradle.properties) " +
                            "before running assembleRelease / bundleRelease.")
                    }
                }
            }
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.each { output ->
            def abiCodes = ["armeabi-v7a": 1, "arm64-v8a": 2]
            def abi = output.getFilter(com.android.build.OutputFile.ABI)
            if (abi != null) {
                output.versionCodeOverride = abiCodes.get(abi) * 1000 + variant.versionCode
            }
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:hermes-android")

    // ✅ Firebase BOM — controls all Firebase library versions together
    implementation(platform("com.google.firebase:firebase-bom:33.1.0"))

    // ✅ Firebase Messaging (FCM) — required for push notifications
    implementation("com.google.firebase:firebase-messaging")

    // ✅ Firebase Analytics — required for Firebase to initialize properly
    implementation("com.google.firebase:firebase-analytics")
}

apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle")
applyNativeModulesAppBuildGradle(project)

android.sourceSets.main.java.srcDirs += [
    "build/generated/rncli/src/main/java"
]

apply from: file("../../node_modules/react-native-vector-icons/fonts.gradle")